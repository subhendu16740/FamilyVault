# Deploy Supabase Edge Functions.
#
# Vercel already deploys the web bundle on merge, but Edge Functions ship
# separately — so a merged PR touching supabase/functions/ used to change
# nothing until someone ran the CLI by hand. This closes that gap.
#
# The branch decides the project:
#
#   dev  -> DEV  (tkqsfoppwlyupentuixy)   the integration branch
#   main -> PROD (yrcmdixqgvmhqxejvlor)   what is live
#
# This inversion is the whole point, and getting it wrong is silent. Before
# `dev` existed, main WAS the integration branch and deployed to DEV. Leaving
# that in place while making main the release branch would mean every
# production release quietly shipped its functions to DEV and left PROD on
# old code — which is exactly the class of failure this workflow was written
# to end.
#
# workflow_dispatch still targets either project by hand, for a redeploy or
# when a branch build is not what you want.
#
# Migrations are deliberately NOT automated. Running SQL against a database
# holding real documents needs a human who has read the diff — and per
# CLAUDE.md the migration goes FIRST, the function second.
#
# Requires one repository secret:
#   SUPABASE_ACCESS_TOKEN — https://supabase.com/dashboard/account/tokens

name: Deploy Edge Functions

on:
  push:
    branches: [main, dev]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-edge-functions.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Which Supabase project to deploy to'
        required: true
        default: dev
        type: choice
        options: [dev, prod]

env:
  DEV_PROJECT_REF: tkqsfoppwlyupentuixy
  PROD_PROJECT_REF: yrcmdixqgvmhqxejvlor

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Resolve target project
        id: target
        run: |
          # An explicit dispatch wins. Otherwise the branch decides, and
          # anything unrecognised falls to DEV: the safe direction for a
          # mistake is shipping to the test project, never to real data.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ inputs.target }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TARGET="prod"
          else
            TARGET="dev"
          fi

          if [ "$TARGET" = "prod" ]; then
            echo "ref=${PROD_PROJECT_REF}" >> "$GITHUB_OUTPUT"
            echo "name=PROD" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${DEV_PROJECT_REF}" >> "$GITHUB_OUTPUT"
            echo "name=DEV" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

          echo "Deploying to ${{ steps.target.outputs.name }} (${{ steps.target.outputs.ref }})"

          # --use-api bundles server-side, so the runner needs no Docker.
          for fn in ingest-document rag-search invite-member reembed-index; do
            echo "::group::$fn"
            supabase functions deploy "$fn" \
              --project-ref "${{ steps.target.outputs.ref }}" \
              --use-api
            echo "::endgroup::"
          done

      - name: Summary
        run: |
          {
            echo "### Edge Functions deployed to ${{ steps.target.outputs.name }}"
            echo ""
            echo "- \`ingest-document\`"
            echo "- \`rag-search\`"
            echo "- \`invite-member\`"
            echo "- \`reembed-index\`"
            echo ""
            echo "Migrations are not run by this workflow — apply SQL in the dashboard."
          } >> "$GITHUB_STEP_SUMMARY"
